name: build-binaries

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ASR build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install setuptools==80.9.0 backports.tarfile==1.2.0 pyinstaller==6.16.0 faster-whisper==1.2.1 ctranslate2==4.8.5 imageio-ffmpeg==0.6.0 gradio==5.44.1
          python -m pip check
      - name: Check source
        run: |
          python -m py_compile transcribe.py
          python -m unittest discover -s tests -v
          python transcribe.py --self-test
      - name: Build single-file ASR binary
        run: pyinstaller transcribe.py --name Transcriber-ASR-${{ matrix.os }} --onefile --noconfirm --clean --hidden-import backports.tarfile --collect-all faster_whisper --collect-all ctranslate2 --collect-all imageio_ffmpeg --collect-all gradio --collect-all gradio_client --recursive-copy-metadata gradio --copy-metadata gradio_client --copy-metadata safehttpx --copy-metadata huggingface_hub --hidden-import anyio --hidden-import starlette --hidden-import websockets --hidden-import pydantic --hidden-import uvicorn
      - name: Smoke test frozen binary
        shell: bash
        run: |
          binary="dist/Transcriber-ASR-${{ matrix.os }}"
          if [ "${{ runner.os }}" = "Windows" ]; then binary="$binary.exe"; fi
          "$binary" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-ASR-${{ matrix.os }}
          path: dist/**
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Transcriber-ASR-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
